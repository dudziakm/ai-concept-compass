name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hosted Supabase project and its test accounts are not configured in this
  # repository, so e2e and rls used to fail on every PR with "supabase secrets are
  # missing" - a red check that said nothing about the change under test and hid
  # real regressions in the noise. Report availability once, then let the jobs
  # skip instead of failing: the secrets context is not available in a job-level
  # if:, hence the extra job that turns it into a plain output.
  config:
    runs-on: ubuntu-latest
    outputs:
      hosted: ${{ steps.check.outputs.hosted }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
          RLS_USER_A_PASSWORD: ${{ secrets.RLS_USER_A_PASSWORD }}
          RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
          RLS_USER_B_PASSWORD: ${{ secrets.RLS_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in SUPABASE_URL SUPABASE_KEY E2E_USER_EMAIL E2E_USER_PASSWORD \
                      RLS_USER_A_EMAIL RLS_USER_A_PASSWORD RLS_USER_B_EMAIL RLS_USER_B_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "hosted=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hosted Supabase secrets are not configured (missing:$missing) - e2e and rls are skipped."
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix packages/code-reviewer
      - run: npm rebuild better-sqlite3 --prefix packages/code-reviewer
      - run: npm run workflow:check
      - run: npm run astro -- sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, config]
    if: needs.config.outputs.hosted == 'true'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify required E2E configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$E2E_USER_EMAIL"
          test -n "$E2E_USER_PASSWORD"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls:
    runs-on: ubuntu-latest
    needs: [quality, config]
    if: needs.config.outputs.hosted == 'true'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
      RLS_USER_A_PASSWORD: ${{ secrets.RLS_USER_A_PASSWORD }}
      RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
      RLS_USER_B_PASSWORD: ${{ secrets.RLS_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:rls
